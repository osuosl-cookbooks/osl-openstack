---
provisioner:
  name: terraform

driver:
  name: terraform
  command_timeout: 7200
  # The x86 API's haproxy rejects a source over 50 connections per 10s
  # (recipes/ha.rb); 10 parallel creates and polls pass it.
  parallelism: 4

transport:
  name: rsync
  command_timeout: 7200

verifier:
  name: terraform
  # Until kitchen-terraform 8.0.1 ships in Workstation, inputs carry over between
  # systems, so each attrs file pins every input its profiles read.
  systems:
    - name: controller1
      backend: ssh
      hosts_output: controller1
      user: almalinux
      profile_locations:
        - test/integration/block_storage_controller
        - test/integration/compute_controller
        - test/integration/ha
        - test/integration/identity
        - test/integration/image
        - test/integration/network
        - test/integration/orchestration
        - test/integration/telemetry_controller
      attrs:
        - test/integration/multi-node/controller1.yml
      sudo: true
    - name: controller2
      backend: ssh
      hosts_output: controller2
      user: almalinux
      profile_locations:
        - test/integration/block_storage_controller
        - test/integration/compute_controller
        - test/integration/ha
        - test/integration/identity
        - test/integration/image
        - test/integration/network
        - test/integration/orchestration
        - test/integration/telemetry_controller
      attrs:
        - test/integration/multi-node/controller2.yml
      sudo: true
<% # TF_VAR_computes (0 to 3, default 1) is how many computes terraform builds %>
<% (ENV['TF_VAR_computes'] || '1').to_i.times do |i| %>
<% name = i.zero? ? 'compute' : "compute#{i + 1}" %>
    - name: <%= name %>
      backend: ssh
      hosts_output: <%= name %>
      user: almalinux
      profile_locations:
        - test/integration/compute
        - test/integration/telemetry_compute
      sudo: true
<% end %>
    - name: jumphost
      backend: ssh
      hosts_output: jumphost
      user: almalinux
      profile_locations:
        - test/integration/upgrade_runner
      sudo: true
    - name: mq1
      backend: ssh
      hosts_output: mq1
      user: almalinux
      profile_locations:
        - test/integration/coordination_tier
        - test/integration/messaging_tier
      attrs:
        - test/integration/multi-node/mq.yml
      sudo: true
    - name: mq2
      backend: ssh
      hosts_output: mq2
      user: almalinux
      profile_locations:
        - test/integration/coordination_tier
        - test/integration/messaging_tier
      attrs:
        - test/integration/multi-node/mq.yml
      sudo: true
    - name: mq3
      backend: ssh
      hosts_output: mq3
      user: almalinux
      profile_locations:
        - test/integration/coordination_tier
        - test/integration/messaging_tier
      attrs:
        - test/integration/multi-node/mq.yml
      sudo: true
<% if ENV['TF_VAR_region2'] == '1' %>
    - name: controller_region2
      backend: ssh
      hosts_output: controller_region2
      user: almalinux
      profile_locations:
        - test/integration/compute_controller
        - test/integration/image
        - test/integration/network
        - test/integration/ops_messaging
      attrs:
        - test/integration/multi-node/controller_region2.yml
      sudo: true
    - name: compute_region2
      backend: ssh
      hosts_output: compute_region2
      user: almalinux
      profile_locations:
        - test/integration/compute
        - test/integration/telemetry_compute
      attrs:
        - test/integration/multi-node/compute_region2.yml
      sudo: true
<% end %>

platforms:
  - name: almalinux-9
    driver:
      variables:
        os_image: "AlmaLinux 9"
        ssh_user_name: "almalinux"

suites:
  - name: multi-node
