---
verifier:
  name: inspec
driver:
  name: openstack
  flavor_ref: 'c2.local.8c8m50d'
  user_data: userdata.txt
provisioner:
  name: cinc_infra
  product_version: 18
  deprecations_as_errors: true
  roles_path: test/integration/roles
  data_bags_path: test/integration/data_bags
  encrypted_data_bag_secret_key_path: test/integration/encrypted_data_bag_secret
  enforce_idempotency: true
  multiple_converge: 2
  attributes:
    base:
      packages: []
    osl-openstack:
      node_type: controller
    osl-prometheus:
      scrape_configs: false

suites:
  - name: mon
    excludes:
      - almalinux-10
    run_list:
      - recipe[osl-openstack::mon]
  - name: ha
    excludes:
      - almalinux-10
    attributes:
      osl-openstack:
        databag_item: ha
    run_list:
      - recipe[openstack_test::ha]
      - recipe[osl-openstack::ha]
      - recipe[osl-openstack::mon]
  - name: ops_messaging
    excludes:
      - almalinux-10
    driver_config:
      server_name: "ops-messaging-<%= ENV['USER'] %>"
    run_list:
      - role[openstack_tk]
      - recipe[osl-openstack::ops_messaging]
  - name: messaging_tier
    # The tier runs on EL10 only (RabbitMQ 4.2 + valkey from AppStream).
    excludes:
      - almalinux-9
    driver_config:
      server_name: "messaging-tier-<%= ENV['USER'] %>"
    attributes:
      osl-openstack:
        databag_item: messaging_tier
        node_type: messaging
    run_list:
      - role[openstack_tk]
      - recipe[osl-openstack::ops_messaging]
      - recipe[osl-openstack::ops_coordination]
      - recipe[osl-openstack::mon]
    verifier:
      inspec_tests:
        - test/integration/coordination_tier
        - test/integration/messaging_tier
      inputs:
        nrpe_checks: true
  - name: identity
    excludes:
      - almalinux-10
    driver_config:
      server_name: "identity-<%= ENV['USER'] %>"
    attributes:
      osl-selinux:
        enforcing: true
    run_list:
      - role[openstack_tk]
      - role[openstack_ops_identity]
    verifier:
      inspec_tests:
        - test/integration/selinux
        - test/integration/identity
        - test/integration/ops_messaging
  # The bag targets zed: Chef stages it and stays on yoga; needs zed published to openstack/zed/
  - name: upgrade
    excludes:
      - almalinux-10
    driver_config:
      server_name: "upgrade-<%= ENV['USER'] %>"
    attributes:
      osl-openstack:
        databag_item: upgrade
    run_list:
      - recipe[openstack_test::upgrade_yoga]
      - role[openstack_tk]
      - role[openstack_ops_identity]
    verifier:
      inspec_tests:
        - test/integration/upgrade
  - name: image
    excludes:
      - almalinux-10
    driver_config:
      server_name: "image-<%= ENV['USER'] %>"
    attributes:
      osl-selinux:
        enforcing: true
    run_list:
      - role[openstack_tk]
      - recipe[openstack_test::ceph]
      - role[openstack_ops_identity]
      - recipe[osl-openstack::image]
      - recipe[openstack_test::image_upload]
    verifier:
      inputs:
        nova_api: false
      inspec_tests:
        - test/integration/selinux
        - test/integration/identity
        - test/integration/image
        - test/integration/ops_messaging
  - name: image-local-storage
    excludes:
      - almalinux-10
    driver_config:
      server_name: "image-local-storage<%= ENV['USER'] %>"
      user_data: userdata-node1.txt
    run_list:
      - role[openstack_tk]
      - role[openstack_ops_identity]
      - recipe[osl-openstack::image]
      - recipe[openstack_test::image_upload]
    verifier:
      inputs:
        local_storage: true
        nova_api: false
      inspec_tests:
        - test/integration/identity
        - test/integration/image
        - test/integration/ops_messaging
  - name: network_controller
    excludes:
      - almalinux-10
    driver_config:
      server_name: "network-controller-<%= ENV['USER'] %>"
    run_list:
      - recipe[openstack_test]
      - role[openstack_tk]
      - role[openstack_ops_identity]
      - recipe[osl-openstack::network_controller]
      - recipe[openstack_test::create_network]
    verifier:
      inspec_tests:
        - test/integration/identity
        - test/integration/network
        - test/integration/ops_messaging
  - name: network
    excludes:
      - almalinux-10
    driver_config:
      server_name: "network-<%= ENV['USER'] %>"
    attributes:
      osl-selinux:
        enforcing: true
    run_list:
      - recipe[openstack_test]
      - role[openstack_tk]
      - role[openstack_ops_identity]
      - recipe[osl-openstack::network_controller]
      - recipe[osl-openstack::network]
      - recipe[openstack_test::create_network]
    verifier:
      inspec_tests:
        - test/integration/selinux
        - test/integration/identity
        - test/integration/network
        - test/integration/ops_messaging
  - name: compute_controller
    excludes:
      - almalinux-10
    driver_config:
      server_name: "compute-controller-<%= ENV['USER'] %>"
    attributes:
      osl-selinux:
