---
name: compute-controller
version: 0.1.0
inputs:
  - name: db_endpoint
    value: localhost
  - name: controller_endpoint
    value: controller.testing.osuosl.org
  - name: local_storage
    value: false
  - name: nova_local_storage
    value: false
    description: Whether this node's nova uses local storage (compute.local_storage in the bag).
  - name: cinder_missing
    value: false
    description: nova.conf has [cinder] but the run deploys no cinder, so nova-status warns.
  - name: haproxy_tls
    value: false
    description: >
      Set true when haproxy on the VIP terminates TLS for novnc -
      nova-novncproxy runs without --ssl_only and has no local cert
      files in that mode.
  - name: messaging_host
    value: controller.testing.osuosl.org
  - name: messaging_port
    value: 5672
  - name: memcached_host
    value: controller.testing.osuosl.org
