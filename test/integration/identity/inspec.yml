---
name: identity
version: 0.1.0
depends:
  - name: osuosl-baseline
    git: https://github.com/osuosl/osuosl-baseline.git
inputs:
  - name: ssl_port
    profile: osuosl-baseline
    value:
      - 5000
  - name: db_endpoint
    value: localhost
  - name: skip_ssl_baseline
    value: false
  - name: messaging_host
    value: controller.testing.osuosl.org
  - name: messaging_port
    value: 5672
  - name: memcached_host
    value: controller.testing.osuosl.org
  - name: haproxy_tls
    value: false
